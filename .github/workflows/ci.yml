name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install pytest pytest-cov

      - name: 运行测试并统计覆盖率
        run: |
          pytest test_calculator.py -v --cov=calculator --cov-report=term-missing

      - name: 覆盖率门禁
        run: |
          coverage report --fail-under=80
          
